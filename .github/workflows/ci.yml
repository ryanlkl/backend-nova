name: Deploy

on: 
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: 3.12

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      env:
        DB_USER: test_user
        DB_PASSWORD: test_password
        DB_HOST: localhost
        DB_PORT: "5432"
        DB_NAME: test_db
        SUPABASE_URL: https://test.supabase.co
        SUPABASE_SERVICE_ROLE: test-service-key
        CHROMA_API_KEY: test-chroma-key
        CHROMA_TENANT_KEY: test-tenant-key
      run: |
        pytest -v --tb=short
